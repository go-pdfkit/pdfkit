name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  GOWORK: "off"
  CGO_ENABLED: "0"

jobs:
  test:
    name: Build + test + exact 100% coverage gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.1"
          check-latest: true
          cache: true

      # qpdf is a second, independent oracle: it reads back what we wrote and
      # says whether it is well formed. Without it TestObjectStreamsQPDF skips
      # and the lane is green over the one test a stranger performs.
      - name: qpdf, the independent oracle for what we write
        run: sudo apt-get update -qq && sudo apt-get install -y -qq qpdf

      - name: go vet
        run: go vet ./...

      - name: Test with coverage
        env:
          PDFKIT_REQUIRE_QPDF: "1"
        run: go test -covermode=set -coverprofile=coverage.out ./...

      - name: Assert exact 100% statement coverage
        run: |
          go tool cover -func=coverage.out | tail -n +1 > /tmp/cov.txt
          below=$(go tool cover -func=coverage.out | awk '$3 != "100.0%"')
          if [ -n "$below" ]; then
            echo "::error::coverage below 100%"
            echo "$below"
            exit 1
          fi
          echo "all statements covered (100.0%)"

      - name: Cross-compile (6 64-bit arches + wasm + darwin + windows)
        run: |
          for arch in amd64 arm64 riscv64 loong64 ppc64le s390x; do
            echo "== linux/$arch =="
            GOOS=linux GOARCH=$arch go build ./...
          done
          GOOS=js      GOARCH=wasm  go build ./...
          GOOS=darwin  GOARCH=arm64 go build ./...
          GOOS=windows GOARCH=amd64 go build ./...
